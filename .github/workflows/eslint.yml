name: ESLint on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  eslint:
    name: Run ESLint on modified files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
            
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get Changed Files and Lines
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- '*.ts' '*.tsx' '*.js' '*.jsx')
          echo "FILES=$(echo "$FILES" | tr '\n' ' ')" >> $GITHUB_ENV
          echo "Changed lines:"
          > changed-lines.txt
          for file in $FILES; do
            echo "🔎 Diff for file: $file"
            git diff -U0 ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- $file
            
            git diff -U0 ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- $file | \
            awk '/^@@ -[0-9,]+ \+[0-9,]+ @@/ {
              match($0, /\+([0-9]+)/, arr);
              if (arr[1]) print "'$file':" arr[1];
            }' >> changed-lines.txt
          done
          
          cat changed-lines.txt

      - name: Run ESLint on modified files (JSON format)
        if: env.FILES != ''
        run: |
          npx eslint $FILES --format json > eslint-results.json || true
          echo "### ESLint Output:"
          cat eslint-results.json
          cat changed-lines.txt

      - name: Add ESLint Comments to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const results = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
            const changedLinesByFile = {};
            const changedLines = fs.readFileSync('changed-lines.txt', 'utf8').trim().split('\n');
            
            for (const line of changedLines) {
              const [file, lineNumber] = line.split(':');
              if (!changedLinesByFile[file]) {
                changedLinesByFile[file] = new Set();
              }
              changedLinesByFile[file].add(Number(lineNumber));
            }
            
            const pullRequest = context.payload.pull_request;
            const repo = context.repo;
            const commitId = context.payload.pull_request.head.sha;

            for (const result of results) {
              const filePath = path.relative(process.cwd(), result.filePath);
              if (!changedLinesByFile[filePath]) continue;

              for (const message of result.messages) {
                if (message.line && changedLinesByFile[filePath].has(message.line)) {
                  try {
                    await github.rest.pulls.createReviewComment({
                      owner: repo.owner,
                      repo: repo.repo,
                      pull_number: pullRequest.number,
                      body: `**${message.ruleId || 'ESLint'}:** ${message.message}`,
                      path: filePath,
                      line: message.line,
                      side: 'RIGHT', // Use RIGHT for added code
                      commit_id: commitId
                    });
                  } catch (error) {
                    console.log(`Failed to add comment on ${filePath}:${message.line} - ${error.message}`);
                  }
                }
              }
            }
